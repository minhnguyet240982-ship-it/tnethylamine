<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Thí Nghiệm: Methylamine + Copper(II) hydroxide</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            margin: 0;
            overflow: hidden; /* Cố định 1 mặt phẳng, không cuộn */
        }

        .glass-dashboard {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        /* Test Tube Styles */
        .test-tube-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 380px;
            padding-bottom: 20px;
        }

        .test-tube {
            width: 80px;
            height: 280px;
            border: 5px solid rgba(255, 255, 255, 0.8);
            border-top: none;
            border-radius: 0 0 40px 40px;
            position: relative;
            background: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.4) 20%, rgba(255,255,255,0) 100%);
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.05), inset 5px 0px 10px rgba(255,255,255,0.5), 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            z-index: 10;
        }

        .test-tube-lip {
            width: 96px;
            height: 10px;
            border: 5px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            position: absolute;
            top: -5px;
            left: -13px;
            z-index: 11;
        }

        /* Liquid Styles */
        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border-radius: 0 0 34px 34px;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom;
            z-index: 5;
        }

        .liquid::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: scaleY(0.5) translateY(-50%);
        }

        .precipitate-overlay {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at center, rgba(255,255,255,0.7) 1px, transparent 2px);
            background-size: 6px 6px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            mix-blend-mode: overlay;
        }
        
        .show-precipitate .precipitate-overlay { opacity: 1; }

        /* Dropper Styles */
        .dropper-container {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            transition: top 0.5s ease;
            z-index: 20;
            opacity: 0;
        }

        .dropper-active {
            top: -20px;
            opacity: 1;
        }

        .drop {
            width: 12px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            position: absolute;
            bottom: -8px;
            left: 50%;
            margin-left: -6px;
            opacity: 0;
        }

        @keyframes fall {
            0% { transform: rotate(-45deg) translate(0, 0) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: rotate(-45deg) translate(0, 0) scale(1); }
            80% { opacity: 1; transform: rotate(-45deg) translate(-80px, 80px) scale(0.8); }
            100% { opacity: 0; transform: rotate(-45deg) translate(-100px, 100px) scale(0.5); }
        }

        .animate-drop { animation: fall 1s ease-in forwards; }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0); }
            20% { transform: translateX(-8px) rotate(-3deg); }
            40% { transform: translateX(8px) rotate(3deg); }
            60% { transform: translateX(-8px) rotate(-3deg); }
            80% { transform: translateX(8px) rotate(3deg); }
        }

        .animate-shake { animation: shake 0.6s ease-in-out; }

        /* Liquid Color States */
        .liquid-empty { height: 0%; background-color: transparent; }
        .liquid-cuso4 { height: 20%; background-color: rgba(100, 181, 246, 0.8); /* Light Blue */ }
        .liquid-precipitate-state { height: 40%; background-color: rgba(77, 208, 225, 0.95); /* Cyan/Precipitate */ }
        .liquid-complex { height: 60%; background-color: rgba(26, 35, 126, 0.9); /* Deep Blue Complex */ }

    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4 md:p-8 text-gray-800">
    <div id="root" class="w-full h-full max-w-7xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [isAnimating, setIsAnimating] = useState(false);
            const [dropColor, setDropColor] = useState('rgba(100, 181, 246, 0.8)');
            const [isShaking, setIsShaking] = useState(false);
            const [isMusicPlaying, setIsMusicPlaying] = useState(false);
            
            const dropRef = useRef(null);
            const audioRef = useRef(null);

            // Audio track (Royalty-free relaxing ambient loop)
            const audioUrl = "https://assets.mixkit.co/music/preview/mixkit-relaxing-light-music-230.mp3";

            const stepsInfo = [
                {
                    title: "Bắt đầu thí nghiệm",
                    actionText: "Cho dung dịch CuSO₄",
                    description: "Ống nghiệm đã được làm sạch và sấy khô. Sẵn sàng thực hiện phản ứng.",
                    equation: null,
                    icon: "fa-flask"
                },
                {
                    title: "Bước 1: Dung dịch CuSO₄ ban đầu",
                    actionText: "Thêm Methylamine",
                    description: "Cho khoảng 2 mL dung dịch CuSO₄ 0,1 M vào ống nghiệm.",
                    equation: "Dung dịch chứa ion Cu²⁺(aq) có màu xanh lam nhạt, trong suốt.",
                    icon: "fa-tint text-blue-400"
                },
                {
                    title: "Bước 2: Phản ứng tạo kết tủa",
                    actionText: "Thêm dư Methylamine & Lắc",
                    description: "Thêm từ từ dung dịch methylamine 0,1 M vào ống nghiệm.",
                    equation: "CH₃NH₂ + H₂O ⇌ CH₃NH₃⁺ + OH⁻\nCu²⁺ + 2OH⁻ ⟶ Cu(OH)₂↓ (Xanh nhạt)",
                    icon: "fa-snowflake text-cyan-400"
                },
                {
                    title: "Bước 3: Sự hòa tan kết tủa (Tạo phức)",
                    actionText: "Làm lại từ đầu",
                    description: "Lắc đều tới khi kết tủa tan hết trong lượng dư methylamine.",
                    equation: "Cu(OH)₂ + 4CH₃NH₂ ⟶ [Cu(CH₃NH₂)₄]²⁺ + 2OH⁻\n(Dung dịch màu xanh thẫm)",
                    icon: "fa-sync text-indigo-600"
                }
            ];

            const toggleMusic = () => {
                if (isMusicPlaying) {
                    audioRef.current.pause();
                } else {
                    audioRef.current.play().catch(e => console.log("Audio play blocked", e));
                }
                setIsMusicPlaying(!isMusicPlaying);
            };

            const handleNextStep = () => {
                if (isAnimating) return;
                setIsAnimating(true);

                // Start music automatically on first click if not playing
                if (step === 0 && !isMusicPlaying) {
                    audioRef.current.volume = 0.5;
                    audioRef.current.play().catch(() => {});
                    setIsMusicPlaying(true);
                }

                if (step === 0) {
                    setDropColor('rgba(100, 181, 246, 0.8)'); // CuSO4 drop
                    triggerDrop(() => { setStep(1); setIsAnimating(false); });
                } else if (step === 1) {
                    setDropColor('rgba(255, 255, 255, 0.9)'); // CH3NH2 drop
                    triggerDrop(() => { setStep(2); setIsAnimating(false); });
                } else if (step === 2) {
                    setDropColor('rgba(255, 255, 255, 0.9)'); // More CH3NH2
                    triggerDrop(() => {
                        setIsShaking(true);
                        setTimeout(() => {
                            setStep(3);
                            setIsShaking(false);
                            setIsAnimating(false);
                        }, 600); // Shake time matches CSS
                    });
                } else {
                    // Reset
                    setStep(0);
                    setIsAnimating(false);
                }
            };

            const triggerDrop = (callback) => {
                const drop = dropRef.current;
                if (drop) {
                    drop.classList.remove('animate-drop');
                    void drop.offsetWidth; // force reflow
                    drop.classList.add('animate-drop');
                    setTimeout(callback, 1000); 
                } else {
                    callback();
                }
            };

            const getLiquidClass = () => {
                switch(step) {
                    case 0: return 'liquid-empty';
                    case 1: return 'liquid-cuso4';
                    case 2: return 'liquid-precipitate-state show-precipitate';
                    case 3: return 'liquid-complex';
                    default: return 'liquid-empty';
                }
            };

            return (
                <div className="glass-dashboard w-full h-full rounded-[2rem] flex flex-col overflow-hidden relative">
                    
                    {/* Audio Element */}
                    <audio ref={audioRef} loop src={audioUrl}></audio>

                    {/* Header Bar */}
                    <header className="h-20 border-b border-white/40 flex items-center justify-between px-8 bg-white/30 z-20">
                        <div className="flex items-center gap-4">
                            <div className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg">
                                <i className="fas fa-atom text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-gray-800">Hóa Học 12 (KNTT)</h1>
                                <p className="text-sm text-gray-600 font-medium">Mô phỏng: Phản ứng của Methylamine với Cu(OH)₂</p>
                            </div>
                        </div>
                        <button 
                            onClick={toggleMusic}
                            className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${isMusicPlaying ? 'bg-indigo-100 text-indigo-600 shadow-inner' : 'bg-white shadow-md text-gray-500 hover:text-indigo-500'}`}
                            title="Bật/Tắt Nhạc Nền"
                        >
                            <i className={`fas ${isMusicPlaying ? 'fa-volume-up' : 'fa-volume-mute'} text-lg`}></i>
                        </button>
                    </header>

                    {/* Main Content Area - Split into 2 columns */}
                    <main className="flex-1 flex flex-col md:flex-row min-h-0 relative z-10">
                        
                        {/* LEFT PANE: Theory & Controls (Fixed Width) */}
                        <div className="w-full md:w-1/2 lg:w-5/12 p-8 flex flex-col justify-between border-r border-white/40 bg-white/10 h-full overflow-y-auto">
                            <div>
                                {/* Timeline/Progress indicators */}
                                <div className="flex justify-between mb-8 relative">
                                    <div className="absolute top-1/2 left-0 w-full h-1 bg-gray-200 -z-10 -translate-y-1/2 rounded"></div>
                                    {[0, 1, 2, 3].map((s) => (
                                        <div key={s} className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition-all duration-300
                                            ${step >= s ? 'bg-blue-600 text-white shadow-lg shadow-blue-200' : 'bg-gray-200 text-gray-500'}`}>
                                            {s === 0 ? <i className="fas fa-play text-xs"></i> : s}
                                        </div>
                                    ))}
                                </div>

                                {/* Step Information Card */}
                                <div className="bg-white/80 rounded-2xl p-6 shadow-sm border border-white mb-6">
                                    <div className="flex items-center gap-3 mb-4">
                                        <i className={`fas ${stepsInfo[step].icon} text-2xl`}></i>
                                        <h2 className="text-2xl font-bold text-gray-800">{stepsInfo[step].title}</h2>
                                    </div>
                                    <p className="text-gray-700 text-lg mb-4 leading-relaxed">
                                        {stepsInfo[step].description}
                                    </p>
                                    
                                    {stepsInfo[step].equation && (
                                        <div className="bg-blue-50/50 rounded-xl p-4 font-mono text-base text-blue-900 border border-blue-100 whitespace-pre-line shadow-inner">
                                            {stepsInfo[step].equation}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Main Action Button */}
                            <button 
                                onClick={handleNextStep}
                                disabled={isAnimating}
                                className={`w-full py-5 px-6 rounded-2xl font-bold text-white text-xl transition-all duration-300 flex items-center justify-center gap-4
                                    ${isAnimating ? 'bg-gray-400 cursor-not-allowed scale-95' : 
                                      step === 3 ? 'bg-gradient-to-r from-indigo-600 to-purple-600 hover:shadow-xl hover:shadow-indigo-200 hover:-translate-y-1' : 
                                      'bg-gradient-to-r from-blue-500 to-blue-600 hover:shadow-xl hover:shadow-blue-200 hover:-translate-y-1'}`}
                            >
                                {isAnimating ? (
                                    <><i className="fas fa-spinner fa-spin"></i> Đang phản ứng...</>
                                ) : (
                                    <>
                                        {stepsInfo[step].actionText} 
                                        {step === 3 ? <i className="fas fa-undo-alt"></i> : <i className="fas fa-chevron-circle-right"></i>}
                                    </>
                                )}
                            </button>
                        </div>

                        {/* RIGHT PANE: Experiment Simulation Area */}
                        <div className="w-full md:w-1/2 lg:w-7/12 p-8 flex items-center justify-center relative bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] h-full">
                            
                            {/* Central Experiment Setup */}
                            <div className="relative w-full max-w-sm aspect-square flex items-center justify-center bg-white/40 rounded-full shadow-[0_0_60px_rgba(255,255,255,0.8)] backdrop-blur-sm border-2 border-white/60">
                                
                                {/* Status Legend (Floating) */}
                                <div className="absolute -right-8 top-10 flex flex-col gap-3">
                                    <div className={`px-4 py-2 bg-white/90 backdrop-blur rounded-xl shadow-md text-sm font-semibold flex items-center gap-3 transition-all duration-500 transform ${step >= 1 ? 'translate-x-0 opacity-100' : 'translate-x-10 opacity-0'}`}>
                                        <div className="w-4 h-4 rounded-full bg-[#64B5F6] border border-gray-200"></div> Cu²⁺(aq)
                                    </div>
                                    <div className={`px-4 py-2 bg-white/90 backdrop-blur rounded-xl shadow-md text-sm font-semibold flex items-center gap-3 transition-all duration-500 transform ${step >= 2 ? 'translate-x-0 opacity-100' : 'translate-x-10 opacity-0'}`}>
                                        <div className="w-4 h-4 rounded-full bg-[#4DD0E1] border border-gray-200"></div> Cu(OH)₂ ↓
                                    </div>
                                    <div className={`px-4 py-2 bg-white/90 backdrop-blur rounded-xl shadow-md text-sm font-semibold flex items-center gap-3 transition-all duration-500 transform ${step >= 3 ? 'translate-x-0 opacity-100' : 'translate-x-10 opacity-0'}`}>
                                        <div className="w-4 h-4 rounded-full bg-[#1A237E] border border-gray-200"></div> [Cu(CH₃NH₂)₄]²⁺
                                    </div>
                                </div>

                                {/* Simulation Canvas */}
                                <div className="test-tube-container">
                                    {/* Dropper Component */}
                                    <div className={`dropper-container flex flex-col items-center ${isAnimating && step !== 3 ? 'dropper-active' : ''}`}>
                                        <svg width="30" height="90" viewBox="0 0 24 80" fill="none" xmlns="http://www.w3.org/2000/svg" className="drop-shadow-lg">
                                            <path d="M12 0C7.58172 0 4 3.58172 4 8V20C4 21.6569 5.34315 23 7 23H17C18.6569 23 20 21.6569 20 20V8C20 3.58172 16.4183 0 12 0Z" fill="#FF8A65"/>
                                            <path d="M9 23H15V65L13 75H11L9 65V23Z" fill="rgba(255,255,255,0.9)" stroke="#CFD8DC" strokeWidth="2"/>
                                        </svg>
                                        <div ref={dropRef} className="drop shadow-sm" style={{ backgroundColor: dropColor }}></div>
                                    </div>

                                    {/* Test Tube Element */}
                                    <div className={`relative ${isShaking ? 'animate-shake' : ''}`}>
                                        <div className="test-tube-lip"></div>
                                        <div className="test-tube">
                                            <div className={`liquid ${getLiquidClass()}`}>
                                                <div className="precipitate-overlay"></div>
                                            </div>
                                            {/* Tube Glare */}
                                            <div className="absolute top-2 left-2 w-3 h-52 bg-white/50 rounded-full blur-[2px]"></div>
                                            <div className="absolute top-10 right-2 w-1 h-32 bg-white/30 rounded-full blur-[1px]"></div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
